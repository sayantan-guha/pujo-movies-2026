<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pujo Movies 2026</title>
<meta name="description" content="Head-to-head box-office analysis for four Kolkata Pujo releases, refreshed every 30 minutes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* hoichoi design system — light theme tokens, read from project/tokens.json */
    --bg-base: #ffffff;
    --bg-surface-2: #f4f4f4;
    --bg-tint: rgba(0,0,0,0.03);
    --text-1: #0a0a0a;
    --text-2: #404040;
    --text-3: #6a6a6a;
    --border-subtle: rgba(0,0,0,0.06);
    --border-default: rgba(0,0,0,0.12);
    --accent: #d20820;        /* red-primary */
    --accent-strong: #ec2028; /* red-bright */
    --accent-deep: #770d11;   /* red-deep / oxblood */
    --magenta-deep: #6d0550;
    --gradient-brand: linear-gradient(90deg, #D20820 0%, #6D0550 100%);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.08);
    --shadow-card-hover: 0 2px 6px rgba(0,0,0,0.08), 0 16px 40px rgba(0,0,0,0.14);
    --glow-focus: 0 0 0 3px rgba(210,8,32,0.30);
    --radius-xs: 4px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-2xl: 24px;
    --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-32: 32px;
    --caps-tracking: 0.12em;

    /* film series colors — drawn from the same brand palette, not a separate accent */
    --film-1: #d20820; /* The Eken — red-primary */
    --film-2: #404040; /* DeSu7 — slate */
    --film-3: #770d11; /* Bohurupi — red-deep/oxblood */
    --film-4: #6d0550; /* Emperor vs Sarat Chandra — magenta-deep */

    /* fill-rate semantic bands — distinct from the brand accent on purpose */
    --good: #3f8f66;
    --good-bg: #e7f3ec;
    --warn: #b8862c;
    --warn-bg: #faf0db;
    --crit: #c1572c;
    --crit-bg: #fbe9e0;
    --sold: #7a2420;
    --sold-bg: #f3dcd8;

    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg-base);
    color: var(--text-1);
    font-family: "Outfit", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 72px; }

  .eyebrow {
    font-family: "Outfit", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: var(--caps-tracking);
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 8px;
  }
  h1.title {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .updated { font-family: "Outfit", monospace; font-size: 12px; color: var(--text-3); text-align: right; }
  .updated b { color: var(--text-1); font-weight: 400; }
  .brand-rule { height: 3px; border-radius: 999px; background: var(--gradient-brand); margin: 18px 0 26px; width: 100%; }

  /* film legend / toggle chips */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .film-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 10px;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    transition: box-shadow 120ms ease, opacity 120ms ease;
  }
  .film-chip .sw { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto; }
  .film-chip .n { font-family: "Outfit", monospace; font-size: 11px; color: var(--text-3); }
  .film-chip.off { opacity: 0.4; }
  .film-chip:hover { box-shadow: var(--shadow-card); }
  .film-chip:focus-visible { outline: none; box-shadow: var(--glow-focus); }

  /* KPI head-to-head row */
  .kpi-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 36px 0 14px;
  }
  .section-title {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0;
  }
  .section-sub { font-size: 13px; color: var(--text-3); margin: 2px 0 0; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 8px;
  }
  .kpi-card {
    background: var(--bg-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-card);
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .kpi-card .film-name { font-size: 13.5px; font-weight: 600; margin: 0 0 10px; padding-left: 6px; display: flex; align-items: center; gap: 8px; }
  .leading-tag {
    font-family: "Outfit", sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: var(--caps-tracking);
    text-transform: uppercase;
    color: #fff;
    background: var(--gradient-brand);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .kpi-card .big { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 32px; padding-left: 6px; display: flex; align-items: baseline; gap: 8px; }
  .kpi-card .big .unit { font-size: 15px; font-weight: 600; color: var(--text-3); }
  .kpi-card .delta { font-family: "Outfit", monospace; font-size: 12px; padding-left: 6px; margin-top: 2px; }
  .kpi-card .delta.up { color: var(--good); }
  .kpi-card .delta.down { color: var(--crit); }
  .kpi-card .delta.flat { color: var(--text-3); }
  .kpi-card .meta { padding-left: 6px; margin-top: 10px; font-size: 11.5px; color: var(--text-3); display: flex; gap: 12px; }
  .kpi-card .meta b { font-family: "Outfit", monospace; color: var(--text-2); font-weight: 400; }

  /* chart panel */
  .panel {
    background: var(--bg-surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-2xl);
    padding: 22px 24px 18px;
    margin-bottom: 8px;
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .toggle-group { display: flex; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 999px; padding: 3px; }
  .toggle-btn {
    font-family: "Outfit", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    color: var(--text-3);
    cursor: pointer;
    border: none;
    background: transparent;
  }
  .toggle-btn.active { background: var(--text-1); color: #fff; }
  svg.chart { width: 100%; height: auto; display: block; }
  svg.chart text { font-family: "Outfit", sans-serif; fill: var(--text-3); }
  svg.chart .axis-line { stroke: var(--border-default); stroke-width: 1; }
  svg.chart .grid-line { stroke: var(--border-subtle); stroke-width: 1; }
  svg.chart .today-line { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
  svg.chart .series-line { fill: none; stroke-width: 2.5; }
  svg.chart .series-dot { stroke: var(--bg-base); stroke-width: 1.5; }
  svg.chart .bar { }
  svg.chart .dim { opacity: 0.15; }

  /* head-to-head table */
  .table-scroll { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }
  table.h2h { border-collapse: collapse; width: 100%; min-width: 720px; background: var(--bg-base); }
  table.h2h th, table.h2h td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
  table.h2h thead th {
    font-family: "Outfit", sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: var(--caps-tracking);
    color: var(--text-3);
    font-weight: 600;
    background: var(--bg-surface-2);
  }
  table.h2h tbody tr:last-child td { border-bottom: none; }
  table.h2h tbody tr.is-today { background: var(--bg-tint); }
  table.h2h td.date-cell { font-weight: 600; font-size: 13.5px; }
  table.h2h td.date-cell .dow { font-weight: 400; color: var(--text-3); font-size: 11.5px; margin-left: 6px; }
  .cell-fill { font-family: "Outfit", monospace; font-weight: 600; font-size: 13px; }
  .cell-rev { font-family: "Outfit", monospace; font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .leader-badge {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 999px;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
  .thin-note { font-size: 10px; color: var(--text-3); font-style: italic; }

  /* page-level tab bar */
  .tab-bar {
    display: flex;
    gap: 28px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 26px;
    overflow-x: auto;
  }
  .tab-item {
    font-family: "Outfit", sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-3);
    padding: 10px 1px 12px;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    background: none;
    border: none;
  }
  .tab-item:hover { color: var(--text-1); }
  .tab-item.active { color: var(--text-1); }
  .tab-item.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 3px;
    border-radius: 999px;
    background: var(--gradient-brand);
  }

  /* show-wise tab (per movie) */
  .date-pills { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 20px; }
  .date-pill {
    font-family: "Outfit", monospace;
    font-size: 12.5px;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface-2);
    color: var(--text-3);
    cursor: pointer;
    white-space: nowrap;
  }
  .date-pill.active { background: var(--text-1); border-color: var(--text-1); color: #fff; font-weight: 600; }

  .stat-tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: var(--caps-tracking); color: var(--text-3); margin-bottom: 8px; padding-left: 6px; }
  .stat-tile .big { padding-left: 6px; }

  .status-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin: -4px 0 18px; }
  .status-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

  .sort-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-3); margin-bottom: 16px; }
  .sort-row select {
    font-family: "Outfit", sans-serif;
    font-size: 12.5px;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-default);
    background: var(--bg-base);
    color: var(--text-1);
  }

  .cinema-block { padding: 16px 0; border-top: 1px solid var(--border-subtle); }
  .cinema-block:first-child { border-top: none; }
  .cinema-block .cname { font-weight: 600; font-size: 14.5px; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
  .cinema-block .cname .avg { font-family: "Outfit", monospace; font-size: 11.5px; color: var(--text-3); font-weight: 400; }
  .ticket-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .ticket {
    width: 128px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 8px 10px 9px;
    background: var(--bg-base);
    position: relative;
  }
  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 999px;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-subtle);
    top: 50%;
    transform: translateY(-50%);
  }
  .ticket::before { left: -5px; }
  .ticket::after { right: -5px; }
  .ticket .time { font-family: "Outfit", monospace; font-weight: 600; font-size: 13px; }
  .ticket .tag { font-size: 9.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.03em; height: 12px; overflow: hidden; }
  .ticket .bar-track { margin-top: 6px; height: 5px; border-radius: 3px; background: var(--bg-surface-2); overflow: hidden; }
  .ticket .bar-fill { height: 100%; border-radius: 3px; }
  .ticket .pct { margin-top: 5px; font-family: "Outfit", monospace; font-size: 11.5px; display: flex; justify-content: space-between; }
  .status-good { color: var(--good); } .status-warn { color: var(--warn); } .status-crit { color: var(--crit); } .status-sold { color: var(--sold); }
  .bar-good { background: var(--good); } .bar-warn { background: var(--warn); } .bar-crit { background: var(--crit); } .bar-sold { background: var(--sold); }
  .bg-good { background: var(--good-bg); } .bg-warn { background: var(--warn-bg); } .bg-crit { background: var(--crit-bg); } .bg-sold { background: var(--sold-bg); }

  /* directional (BookMyShow) tickets — a band, never a fabricated percentage */
  .ticket.directional { border-style: dashed; }
  .ticket.directional .band {
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: var(--radius-xs);
    display: inline-block;
  }

  .jump-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: -6px 0 16px; }
  .jump-link {
    font-family: "Outfit", sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--bg-surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: 6px 13px;
    text-decoration: none;
  }
  .jump-link:hover { color: var(--accent); border-color: var(--accent); }
  .source-section { margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--border-default); scroll-margin-top: 16px; }
  .source-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .source-head h3 { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 16px; margin: 0; }
  .source-badge {
    font-family: "Outfit", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .source-note { font-size: 12px; color: var(--text-3); margin: 0 0 14px; }
  .pan-india-stat {
    display: inline-flex;
    gap: 18px;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 10px 18px;
    margin-bottom: 16px;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .pan-india-stat b { font-family: "Outfit", monospace; color: var(--text-1); font-weight: 600; font-size: 14px; display: block; }

  /* insights — executive-summary style: one headline statement per bullet,
     a short supporting line underneath, capped to the top few that matter
     rather than a long dump of every signal found. */
  .insights { display: flex; flex-direction: column; gap: 10px; }
  .insight-card {
    background: var(--bg-base);
    border: 1px solid var(--border-subtle);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-2);
  }
  .insight-card b { color: var(--text-1); font-weight: 600; }
  .insight-card .tag {
    display: block;
    font-family: "Outfit", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: var(--caps-tracking);
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .insight-card .headline {
    display: block;
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-1);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .insight-card .support { display: block; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }

  /* anomaly cards — share the insight-card shell but signal severity through
     the left-rail colour, same red/amber/green vocabulary as the fill-rate
     bands elsewhere, so "this needs a look" never reads as the brand accent. */
  .insight-card.anomaly.severe { border-left-color: var(--sold); background: var(--sold-bg); }
  .insight-card.anomaly.moderate { border-left-color: var(--crit); }
  .insight-card.anomaly.mild { border-left-color: var(--warn); }
  .insight-card.anomaly .tag.sev-severe { color: var(--sold); }
  .insight-card.anomaly .tag.sev-moderate { color: var(--crit); }
  .insight-card.anomaly .tag.sev-mild { color: var(--warn); }
  .anomaly-caveat { font-size: 12.5px; color: var(--text-3); margin: -6px 0 14px; line-height: 1.6; }

  footer.note {
    margin-top: 28px;
    font-size: 11.5px;
    color: var(--text-3);
    line-height: 1.7;
    border-top: 1px solid var(--border-subtle);
    padding-top: 16px;
  }

  .empty-state { padding: 60px 10px; text-align: center; color: var(--text-3); font-size: 14px; }

  ::-webkit-scrollbar { height: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 4px; }

  @media (max-width: 860px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Box office tracker</p>
  <header class="top">
    <h1 class="title">Pujo Movies 2026</h1>
    <div class="updated" id="updatedLine">Loading&hellip;</div>
  </header>
  <div class="brand-rule"></div>

  <nav class="tab-bar" id="tabBar"></nav>

  <div id="content">
    <div class="empty-state">Loading box-office data&hellip;</div>
  </div>

  <footer class="note" id="footnote"></footer>
</div>

<script>
  const FILM_COLORS = { "230309": "var(--film-1)", "213662": "var(--film-2)", "230211": "var(--film-3)", "220611": "var(--film-4)" };
  const FILM_COLOR_HEX = { "230309": "#d20820", "213662": "#404040", "230211": "#770d11", "220611": "#6d0550" };
  // Below this many shows on a date, a film's fill rate for that date is too thin a
  // sample to compare against other films — a single late matinee can show 100% while
  // telling you nothing about demand. Such cells still display, just excluded from
  // "who's leading today" logic and visually muted.
  const MIN_SHOWS_FOR_COMPARISON = 5;

  // Cinema names on district.in carry the chain as a prefix for multiplexes
  // ("INOX Quest Mall, …", "Miraj Cinemas : Downtown Mall, …") but standalone
  // single-screen halls don't belong to any of these — they fall back to
  // "Independent / Other" rather than being mis-labelled by their own name.
  const KNOWN_CHAINS = ["Cinepolis", "INOX", "PVR", "Miraj Cinemas", "SVF Cinemas", "Nazrultirtha Cinema"];
  function chainOf(cinemaName) {
    for (const c of KNOWN_CHAINS) if (cinemaName.startsWith(c)) return c;
    return "Independent / Other";
  }

  const STATUS_THRESH = [
    { max: 40, cls: "good", label: "Available" },
    { max: 75, cls: "warn", label: "Filling fast" },
    { max: 95, cls: "crit", label: "Almost full" },
    { max: 101, cls: "sold", label: "Housefull" },
  ];
  function statusFor(pct) {
    for (const t of STATUS_THRESH) if (pct < t.max) return t;
    return STATUS_THRESH[STATUS_THRESH.length - 1];
  }
  function fmtTime(t) {
    if (!t) return "--:--";
    let [h, m] = t.split(":").map(Number);
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${String(m).padStart(2, "0")} ${ap}`;
  }

  function todayIST() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }
  function fmtDate(d) {
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  }
  function fmtDow(d) {
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("en-IN", { weekday: "short" });
  }
  function fmtRevenue(n) {
    if (n >= 1e7) return "₹" + (n / 1e7).toFixed(2) + "Cr";
    if (n >= 1e5) return "₹" + (n / 1e5).toFixed(2) + "L";
    if (n >= 1e3) return "₹" + (n / 1e3).toFixed(1) + "k";
    return "₹" + Math.round(n);
  }
  function timeAgo(iso) {
    if (!iso) return "unknown";
    const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + " hr ago";
    return Math.round(hrs / 24) + " day(s) ago";
  }

  let MOVIES = [];
  let ACTIVE = new Set();
  let VIEW = "fill";
  let ACTIVE_TAB = "h2h"; // "h2h" or a movie id
  const SHOW_TAB_STATE = {}; // movieId -> { date, sort }

  // ---- aggregation --------------------------------------------------
  function aggregate(movie) {
    // date -> { shows, totalSeats, totalFilled, revenue }
    const byDate = {};
    movie.cinemas.forEach(c => c.shows.forEach(s => {
      const d = byDate[s.date] || (byDate[s.date] = { shows: 0, totalSeats: 0, totalFilled: 0, revenue: 0 });
      d.shows += 1;
      d.totalSeats += s.total || 0;
      d.totalFilled += s.filled || 0;
      d.revenue += s.revenue || 0;
    }));
    return byDate;
  }

  function allDates() {
    const set = new Set();
    MOVIES.forEach(m => (m.showDates || []).forEach(d => set.add(d)));
    return Array.from(set).sort();
  }

  // ---- render: page tab bar ---------------------------------------------
  function renderTabBar() {
    const el = document.getElementById("tabBar");
    const tabs = [{ id: "h2h", label: "Head-to-Head" }, ...MOVIES.map(m => ({ id: m.id, label: m.name }))];
    el.innerHTML = tabs.map(t => `<button class="tab-item ${ACTIVE_TAB === t.id ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`).join("");
    el.querySelectorAll(".tab-item").forEach(btn => {
      btn.addEventListener("click", () => { ACTIVE_TAB = btn.dataset.tab; renderAll(); });
    });
  }

  // ---- render: film legend / series toggle (head-to-head tab only) ------
  function filmLegendHtml() {
    const chips = MOVIES.map(m => {
      const agg = aggregate(m);
      const totalShows = Object.values(agg).reduce((a, d) => a + d.shows, 0);
      const off = !ACTIVE.has(m.id);
      return `<div class="film-chip${off ? " off" : ""}" data-id="${m.id}" tabindex="0" role="button">
        <span class="sw" style="background:${FILM_COLORS[m.id]}"></span>${m.name}<span class="n">${totalShows}</span>
      </div>`;
    }).join("");
    return `<div class="legend">${chips}</div>`;
  }
  function wireFilmLegend(root) {
    root.querySelectorAll(".film-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const id = chip.dataset.id;
        if (ACTIVE.has(id)) ACTIVE.delete(id); else ACTIVE.add(id);
        renderAll();
      });
    });
  }

  // ---- render: KPI row (latest trackable day) --------------------------
  function renderKpis(dates) {
    const today = todayIST();
    let focusDate = dates.includes(today) ? today : dates[0];
    const focusIdx = dates.indexOf(focusDate);
    const prevDate = focusIdx > 0 ? dates[focusIdx - 1] : null;

    const cards = MOVIES.map(m => {
      const agg = aggregate(m);
      const d = agg[focusDate];
      const fillPct = d && d.totalSeats ? Math.round((d.totalFilled / d.totalSeats) * 100) : null;
      let deltaHtml = '<span class="delta flat">no prior day tracked</span>';
      if (prevDate && agg[prevDate] && agg[prevDate].totalSeats && d && d.totalSeats) {
        const prevPct = (agg[prevDate].totalFilled / agg[prevDate].totalSeats) * 100;
        const diff = Math.round(((d.totalFilled / d.totalSeats) * 100) - prevPct);
        const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
        const arrow = diff > 0 ? "↑" : diff < 0 ? "↓" : "→";
        deltaHtml = `<span class="delta ${cls}">${arrow} ${Math.abs(diff)} pt vs ${fmtDate(prevDate)}</span>`;
      }
      if (d && d.shows > 0 && d.shows < MIN_SHOWS_FOR_COMPARISON) {
        deltaHtml = `<span class="delta flat">just ${d.shows} show${d.shows > 1 ? "s" : ""} &mdash; too thin to compare</span>`;
      }
      return `<div class="kpi-card">
        <div class="stripe" style="background:${FILM_COLORS[m.id]}"></div>
        <p class="film-name">${m.name}</p>
        <div class="big">${fillPct == null ? "&ndash;" : fillPct}<span class="unit">% filled</span></div>
        ${deltaHtml}
        <div class="meta">
          <span><b>${d ? d.shows : 0}</b> shows</span>
          <span><b>${d ? fmtRevenue(d.revenue) : "₹0"}</b> est. revenue</span>
        </div>
      </div>`;
    }).join("");

    return { html: cards, focusDate };
  }

  // ---- chart: fill-rate trend (line) -----------------------------------
  function buildLineChart(dates) {
    const W = 1040, H = 300, padL = 40, padR = 20, padT = 16, padB = 34;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const x = i => padL + (dates.length <= 1 ? innerW / 2 : (i / (dates.length - 1)) * innerW);
    const y = v => padT + innerH - (v / 100) * innerH;

    let gridlines = "";
    [0, 25, 50, 75, 100].forEach(v => {
      gridlines += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" />`;
      gridlines += `<text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5">${v}%</text>`;
    });
    let xlabels = "";
    dates.forEach((d, i) => { xlabels += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="10.5">${fmtDate(d)}</text>`; });

    const today = todayIST();
    let todayLine = "";
    const ti = dates.indexOf(today);
    if (ti >= 0) todayLine = `<line class="today-line" x1="${x(ti)}" x2="${x(ti)}" y1="${padT}" y2="${H - padB}" />`;

    let series = "";
    MOVIES.forEach(m => {
      const dim = ACTIVE.size && !ACTIVE.has(m.id) ? "dim" : "";
      const agg = aggregate(m);
      const pts = dates.map((d, i) => {
        const a = agg[d];
        if (!a || !a.totalSeats) return null;
        return [x(i), y((a.totalFilled / a.totalSeats) * 100), Math.round((a.totalFilled / a.totalSeats) * 100), d];
      });
      const validPts = pts.filter(Boolean);
      if (!validPts.length) return;
      const path = "M" + pts.map(p => p ? `${p[0]},${p[1]}` : null).filter(Boolean).join(" L");
      series += `<path class="series-line ${dim}" d="${path}" stroke="${FILM_COLOR_HEX[m.id]}" />`;
      validPts.forEach(p => {
        series += `<circle class="series-dot ${dim}" cx="${p[0]}" cy="${p[1]}" r="4" fill="${FILM_COLOR_HEX[m.id]}"><title>${m.name} — ${fmtDate(p[3])}: ${p[2]}% filled</title></circle>`;
      });
    });

    return `<svg class="chart" viewBox="0 0 ${W} ${H}">
      <line class="axis-line" x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}" />
      ${gridlines}${todayLine}${series}${xlabels}
    </svg>`;
  }

  // ---- chart: revenue trend (grouped bars) -----------------------------
  function buildBarChart(dates) {
    const W = 1040, H = 300, padL = 56, padR = 20, padT = 16, padB = 34;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const groupW = dates.length ? innerW / dates.length : innerW;
    const barW = Math.min(16, groupW / 6);
    const aggs = MOVIES.map(m => aggregate(m));
    let maxRev = 1;
    dates.forEach(d => aggs.forEach(a => { if (a[d]) maxRev = Math.max(maxRev, a[d].revenue); }));
    const y = v => padT + innerH - (v / maxRev) * innerH;

    let gridlines = "";
    [0, 0.25, 0.5, 0.75, 1].forEach(f => {
      const v = maxRev * f;
      gridlines += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" />`;
      gridlines += `<text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10">${fmtRevenue(v)}</text>`;
    });

    let bars = "", xlabels = "";
    dates.forEach((d, gi) => {
      const groupX = padL + gi * groupW + groupW / 2 - (barW * MOVIES.length) / 2;
      MOVIES.forEach((m, mi) => {
        const a = aggs[mi][d];
        const rev = a ? a.revenue : 0;
        const dim = ACTIVE.size && !ACTIVE.has(m.id) ? "dim" : "";
        const bx = groupX + mi * barW;
        const by = y(rev);
        bars += `<rect class="bar ${dim}" x="${bx}" y="${by}" width="${barW - 2}" height="${(H - padB) - by}" fill="${FILM_COLOR_HEX[m.id]}" rx="2"><title>${m.name} — ${fmtDate(d)}: ${fmtRevenue(rev)}</title></rect>`;
      });
      xlabels += `<text x="${padL + gi * groupW + groupW / 2}" y="${H - 10}" text-anchor="middle" font-size="10.5">${fmtDate(d)}</text>`;
    });

    return `<svg class="chart" viewBox="0 0 ${W} ${H}">
      <line class="axis-line" x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}" />
      ${gridlines}${bars}${xlabels}
    </svg>`;
  }

  // ---- head-to-head table ----------------------------------------------
  function statusBand(pct) {
    if (pct == null) return { cls: "", bg: "transparent" };
    if (pct < 40) return { cls: "good", bg: "var(--good-bg)", color: "var(--good)" };
    if (pct < 75) return { cls: "warn", bg: "var(--warn-bg)", color: "var(--warn)" };
    if (pct < 95) return { cls: "crit", bg: "var(--crit-bg)", color: "var(--crit)" };
    return { cls: "sold", bg: "var(--sold-bg)", color: "var(--sold)" };
  }

  function renderTable(dates) {
    const today = todayIST();
    const aggs = MOVIES.map(m => aggregate(m));
    const rows = dates.map(d => {
      const cells = MOVIES.map((m, mi) => {
        const a = aggs[mi][d];
        const pct = a && a.totalSeats ? Math.round((a.totalFilled / a.totalSeats) * 100) : null;
        return { id: m.id, pct, rev: a ? a.revenue : 0, shows: a ? a.shows : 0 };
      });
      // Only cells with a comparable show count compete for the day's "leader" dot —
      // a lone show at 100% isn't ahead of a wide release still filling up.
      const eligible = cells.filter(c => c.shows >= MIN_SHOWS_FOR_COMPARISON && c.pct != null);
      const maxPct = eligible.length >= 2 ? Math.max(...eligible.map(c => c.pct)) : -1;
      const tds = cells.map(c => {
        const band = statusBand(c.pct);
        const isLeader = c.pct != null && c.pct === maxPct && maxPct >= 0 && c.shows >= MIN_SHOWS_FOR_COMPARISON;
        const thin = c.pct != null && c.shows > 0 && c.shows < MIN_SHOWS_FOR_COMPARISON;
        return `<td>
          ${c.pct == null ? '<span class="cell-fill" style="color:var(--text-3)">&ndash;</span>' :
            `<span class="cell-fill" style="color:${thin ? "var(--text-3)" : band.color}">${isLeader ? '<span class="leader-badge"></span>' : ""}${c.pct}%</span>`}
          <div class="cell-rev">${c.shows ? fmtRevenue(c.rev) + " &middot; " + c.shows + " show" + (c.shows > 1 ? "s" : "") + (thin ? '<span class="thin-note"> &middot; thin sample</span>' : "") : "no shows"}</div>
        </td>`;
      }).join("");
      return `<tr class="${d === today ? "is-today" : ""}">
        <td class="date-cell">${fmtDate(d)}<span class="dow">${fmtDow(d)}${d === today ? " &middot; today" : ""}</span></td>
        ${tds}
      </tr>`;
    }).join("");

    return `<div class="table-scroll"><table class="h2h">
      <thead><tr><th>Date</th>${MOVIES.map(m => `<th>${m.name}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  // ---- revenue so far (cumulative, highest first) -----------------------
  function renderRevenueStrip(dates) {
    const totals = MOVIES.map(m => {
      const agg = aggregate(m);
      let rev = 0, filled = 0, shows = 0;
      dates.forEach(d => { const a = agg[d]; if (a) { rev += a.revenue; filled += a.totalFilled; shows += a.shows; } });
      return { m, rev, filled, shows };
    }).sort((a, b) => b.rev - a.rev);

    const cards = totals.map((t, i) => `
      <div class="kpi-card">
        <div class="stripe" style="background:${FILM_COLORS[t.m.id]}"></div>
        <p class="film-name">${t.m.name}${i === 0 && t.rev > 0 ? '<span class="leading-tag">Leading</span>' : ""}</p>
        <div class="big">${fmtRevenue(t.rev)}</div>
        <div class="meta">
          <span><b>${t.filled.toLocaleString("en-IN")}</b> seats booked</span>
          <span><b>${t.shows}</b> shows</span>
        </div>
      </div>`).join("");

    return `<div class="kpi-row">${cards}</div>`;
  }

  // ---- by cinema chain (cumulative across all tracked dates) -------------
  function renderChainTable() {
    // chain -> movieId -> { seats, filled, shows }
    const chains = {};
    MOVIES.forEach(m => {
      m.cinemas.forEach(c => {
        const chain = chainOf(c.name);
        const bucket = (chains[chain] || (chains[chain] = {}));
        const cell = (bucket[m.id] || (bucket[m.id] = { seats: 0, filled: 0, shows: 0 }));
        c.shows.forEach(s => { cell.seats += s.total || 0; cell.filled += s.filled || 0; cell.shows += 1; });
      });
    });
    const chainNames = Object.keys(chains).sort((a, b) => {
      const totalShows = ch => Object.values(chains[ch]).reduce((n, c) => n + c.shows, 0);
      return totalShows(b) - totalShows(a);
    });
    if (!chainNames.length) return '<div class="empty-state">No chain data yet.</div>';

    const rows = chainNames.map(chain => {
      const cells = MOVIES.map(m => {
        const c = chains[chain][m.id];
        const pct = c && c.seats ? Math.round((c.filled / c.seats) * 100) : null;
        return { pct, shows: c ? c.shows : 0 };
      });
      const eligible = cells.filter(c => c.shows >= MIN_SHOWS_FOR_COMPARISON && c.pct != null);
      const maxPct = eligible.length >= 2 ? Math.max(...eligible.map(c => c.pct)) : -1;
      const tds = cells.map(c => {
        const band = statusBand(c.pct);
        const isLeader = c.pct != null && c.pct === maxPct && maxPct >= 0 && c.shows >= MIN_SHOWS_FOR_COMPARISON;
        const thin = c.pct != null && c.shows > 0 && c.shows < MIN_SHOWS_FOR_COMPARISON;
        return `<td>
          ${c.pct == null ? '<span class="cell-fill" style="color:var(--text-3)">&ndash;</span>' :
            `<span class="cell-fill" style="color:${thin ? "var(--text-3)" : band.color}">${isLeader ? '<span class="leader-badge"></span>' : ""}${c.pct}%</span>`}
          <div class="cell-rev">${c.shows ? c.shows + " show" + (c.shows > 1 ? "s" : "") + (thin ? '<span class="thin-note"> &middot; thin</span>' : "") : "no shows"}</div>
        </td>`;
      }).join("");
      return `<tr><td class="date-cell">${chain}</td>${tds}</tr>`;
    }).join("");

    return `<div class="table-scroll"><table class="h2h">
      <thead><tr><th>Chain</th>${MOVIES.map(m => `<th>${m.name}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  // ---- insights engine ---------------------------------------------------
  // Executive-summary style: every candidate is scored by how much it actually
  // matters, then only the top MAX_INSIGHTS survive — each as a headline
  // "so what" statement with one line of supporting data underneath, the way
  // a consulting deck leads with the takeaway rather than a wall of findings.
  const MAX_INSIGHTS = 5;

  function renderInsights(dates) {
    const aggs = {};
    MOVIES.forEach(m => aggs[m.id] = aggregate(m));
    const candidates = []; // {priority, tag, headline, support}

    const overall = MOVIES.map(m => {
      let seats = 0, filled = 0, rev = 0;
      dates.forEach(d => { const a = aggs[m.id][d]; if (a) { seats += a.totalSeats; filled += a.totalFilled; rev += a.revenue; } });
      return { m, pct: seats ? (filled / seats) * 100 : 0, rev, seats, filled };
    }).sort((a, b) => b.pct - a.pct);
    const revSorted = [...overall].sort((a, b) => b.rev - a.rev);

    // 1. the single most important fact: who's winning, on fill and revenue —
    // merged into one headline when it's the same film on both counts.
    if (overall.length && overall[0].seats) {
      const fillLeader = overall[0], revLeader = revSorted[0];
      if (revLeader && revLeader.rev > 0 && revLeader.m.id === fillLeader.m.id) {
        candidates.push({
          priority: 100, tag: "Clear leader",
          headline: `${fillLeader.m.name} leads on both fill rate and revenue`,
          support: `<b>${fillLeader.pct.toFixed(1)}%</b> average fill and <b>${fmtRevenue(revLeader.rev)}</b> booked so far &mdash; the strongest position of the four films tracked.`,
        });
      } else {
        candidates.push({
          priority: 95, tag: "Fill-rate leader",
          headline: `${fillLeader.m.name} runs the highest average fill rate`,
          support: `<b>${fillLeader.pct.toFixed(1)}%</b> of seats sold across tracked dates${overall[1] ? `, ahead of ${overall[1].m.name} at ${overall[1].pct.toFixed(1)}%` : ""}.`,
        });
        if (revLeader && revLeader.rev > 0) {
          candidates.push({
            priority: 90, tag: "Revenue leader",
            headline: `${revLeader.m.name} leads on estimated gross`,
            support: `<b>${fmtRevenue(revLeader.rev)}</b> booked to date (seats booked &times; listed price, across all tracked dates).`,
          });
        }
      }
    }

    // 2. day-by-day split — only days where at least two films had enough shows
    // to compare like-for-like, so a single lone show can't "win" a day.
    const leaderCount = {};
    let comparableDays = 0;
    dates.forEach(d => {
      const eligible = [];
      MOVIES.forEach(m => {
        const a = aggs[m.id][d];
        if (a && a.totalSeats && a.shows >= MIN_SHOWS_FOR_COMPARISON) eligible.push({ m, pct: (a.totalFilled / a.totalSeats) * 100 });
      });
      if (eligible.length >= 2) {
        comparableDays++;
        const best = eligible.reduce((a, b) => (b.pct > a.pct ? b : a));
        leaderCount[best.m.id] = (leaderCount[best.m.id] || 0) + 1;
      }
    });
    const leaderEntries = Object.entries(leaderCount).sort((a, b) => b[1] - a[1]);
    if (leaderEntries.length && comparableDays) {
      const byId = id => MOVIES.find(m => m.id === id);
      candidates.push({
        priority: 80, tag: "Day-by-day",
        headline: `${byId(leaderEntries[0][0]).name} wins the most individual days`,
        support: `Leads on <b>${leaderEntries[0][1]}</b> of ${comparableDays} day${comparableDays === 1 ? "" : "s"} with a like-for-like comparison (${MIN_SHOWS_FOR_COMPARISON}+ shows on both sides)${leaderEntries[1] ? `; ${byId(leaderEntries[1][0]).name} leads on ${leaderEntries[1][1]}` : ""}.`,
      });
    }

    // 3. booking pace — the single film with the largest swing, not all four
    let bestTrend = null;
    MOVIES.forEach(m => {
      const tracked = dates.filter(d => aggs[m.id][d] && aggs[m.id][d].totalSeats && aggs[m.id][d].shows >= MIN_SHOWS_FOR_COMPARISON);
      if (tracked.length < 2) return;
      const first = aggs[m.id][tracked[0]], last = aggs[m.id][tracked[tracked.length - 1]];
      const firstPct = (first.totalFilled / first.totalSeats) * 100;
      const lastPct = (last.totalFilled / last.totalSeats) * 100;
      const diff = lastPct - firstPct;
      if (!bestTrend || Math.abs(diff) > Math.abs(bestTrend.diff)) bestTrend = { m, firstPct, lastPct, diff, tracked };
    });
    if (bestTrend && Math.abs(bestTrend.diff) >= 8) {
      candidates.push({
        priority: 70, tag: "Booking pace",
        headline: `${bestTrend.m.name}'s fill rate is ${bestTrend.diff > 0 ? "climbing" : "tapering"} closer to show date`,
        support: `<b>${bestTrend.firstPct.toFixed(0)}%</b> on ${fmtDate(bestTrend.tracked[0])} to <b>${bestTrend.lastPct.toFixed(0)}%</b> on ${fmtDate(bestTrend.tracked[bestTrend.tracked.length - 1])} &mdash; read as booking pace, not demand, since later dates have had less time to fill.`,
      });
    }

    // 4. housefull — one aggregated bullet across films, not one per film
    const hfByFilm = MOVIES.map(m => {
      let hfShows = 0, hfCinemas = new Set();
      m.cinemas.forEach(c => c.shows.forEach(s => { if (s.fillRate >= 95) { hfShows++; hfCinemas.add(c.name); } }));
      return { m, hfShows, hfCinemas: hfCinemas.size };
    }).filter(x => x.hfShows > 0).sort((a, b) => b.hfShows - a.hfShows);
    if (hfByFilm.length) {
      const totalHf = hfByFilm.reduce((a, x) => a + x.hfShows, 0);
      const parts = hfByFilm.slice(0, 3).map(x => `${x.m.name} (${x.hfShows})`);
      candidates.push({
        priority: 60, tag: "Housefull",
        headline: `${totalHf} housefull show${totalHf > 1 ? "s" : ""} recorded so far`,
        support: `${parts.join(", ")}${hfByFilm.length > 3 ? ", and others" : ""} &mdash; 95%+ filled as of the last scrape.`,
      });
    }

    // 5. distribution footprint — only worth a mention if the spread is wide
    const footprint = MOVIES.map(m => ({ m, cinemas: m.cinemas.filter(c => c.shows.length).length })).sort((a, b) => b.cinemas - a.cinemas);
    if (footprint.length && footprint[0].cinemas - footprint[footprint.length - 1].cinemas >= 8) {
      candidates.push({
        priority: 40, tag: "Screen count",
        headline: `${footprint[0].m.name} has the widest distribution footprint`,
        support: `<b>${footprint[0].cinemas}</b> screening cinemas vs. <b>${footprint[footprint.length - 1].cinemas}</b> for ${footprint[footprint.length - 1].m.name} &mdash; a wider release naturally dilutes average fill rate per show.`,
      });
    }

    if (!candidates.length) return '<div class="empty-state">Not enough data yet for insights.</div>';
    candidates.sort((a, b) => b.priority - a.priority);
    const topInsights = candidates.slice(0, MAX_INSIGHTS);
    return `<div class="insights">${topInsights.map(c => `<div class="insight-card"><span class="tag">${c.tag}</span><span class="headline">${c.headline}</span><span class="support">${c.support}</span></div>`).join("")}</div>`;
  }

  // ---- anomaly / data-integrity detection --------------------------------
  // This does NOT accuse anyone of anything — it flags statistical patterns
  // that are very hard to produce through organic, ticket-by-ticket sales,
  // so a human can look closer. Three independent, generic signals (nothing
  // here names a specific cinema; any venue tripping the same pattern in a
  // future scrape gets caught the same way):
  //
  //   (A) FROZEN — the exact same (total, avail, filled) triple repeats,
  //       completely unchanged, across many distinct calendar dates for one
  //       film at one cinema, while seats remain unsold (avail > 0).
  //   (B) CROSS-FILM — the identical (total, avail, filled) triple shows up
  //       for TWO DIFFERENT FILMS at the same cinema.
  //   (C) OUTLIER — a single showtime whose fill rate is a dramatic jump
  //       above that same cinema's *other* shows for the same film on the
  //       same date. Consistent with — but not proof of — a single bulk or
  //       corporate block buyout landing all at once.
  //
  // We only ever see one point-in-time snapshot per scrape, so this is all
  // inferred from patterns already sitting inside a single snapshot.
  const FROZEN_MIN_DATES = 4;   // signature must repeat, unchanged, across at least this many distinct dates
  const OUTLIER_MIN_GAP = 45;   // percentage points above the cinema's own same-day/same-film average
  const OUTLIER_MIN_PCT = 70;   // and the show itself must be at least this filled

  function detectAnomalies() {
    const byCinema = {};
    MOVIES.forEach(m => {
      m.cinemas.forEach(c => {
        const bucket = (byCinema[c.name] || (byCinema[c.name] = {}));
        (bucket[m.id] || (bucket[m.id] = [])).push(...c.shows);
      });
    });

    const frozen = [], crossFilm = [], outliers = [];
    const frozenKeys = new Set();

    Object.entries(byCinema).forEach(([cinemaName, byMovie]) => {
      Object.entries(byMovie).forEach(([movieId, shows]) => {
        const movie = MOVIES.find(m => m.id === movieId);
        const sigGroups = {};
        shows.forEach(s => {
          if (s.total == null || s.filled == null || s.avail == null) return;
          const key = `${s.total}|${s.avail}|${s.filled}`;
          (sigGroups[key] || (sigGroups[key] = [])).push(s);
        });
        Object.entries(sigGroups).forEach(([key, group]) => {
          const [total, avail, filled] = key.split("|").map(Number);
          if (avail <= 0) return;
          const distinctDates = Array.from(new Set(group.map(s => s.date))).sort();
          if (distinctDates.length >= FROZEN_MIN_DATES) {
            frozenKeys.add(`${cinemaName}|${movieId}|${key}`);
            frozen.push({
              cinema: cinemaName, movie, total, avail, filled,
              fillRate: Math.round((filled / total) * 100),
              dates: distinctDates,
              times: Array.from(new Set(group.map(s => s.time))).sort(),
              count: group.length,
            });
          }
        });
      });

      const sigToEntry = {};
      Object.entries(byMovie).forEach(([movieId, shows]) => {
        shows.forEach(s => {
          if (s.total == null || s.filled == null || s.avail == null) return;
          const key = `${s.total}|${s.avail}|${s.filled}`;
          const entry = (sigToEntry[key] || (sigToEntry[key] = { movieIds: new Set(), shows: [] }));
          entry.movieIds.add(movieId);
          entry.shows.push({ movieId, ...s });
        });
      });
      Object.entries(sigToEntry).forEach(([key, entry]) => {
        if (entry.movieIds.size < 2) return;
        const wasFrozenSomewhere = Array.from(entry.movieIds).some(mid => frozenKeys.has(`${cinemaName}|${mid}|${key}`));
        if (!wasFrozenSomewhere) return;
        const [total, avail, filled] = key.split("|").map(Number);
        if (filled <= 0 || !total || (filled / total) * 100 < 35) return;
        const byMovieName = {};
        entry.shows.forEach(s => {
          const mv = MOVIES.find(m => m.id === s.movieId);
          (byMovieName[mv.name] || (byMovieName[mv.name] = [])).push(s);
        });
        crossFilm.push({
          cinema: cinemaName, total, avail, filled,
          fillRate: total ? Math.round((filled / total) * 100) : null,
          byMovieName,
          showCount: entry.shows.length,
        });
      });

      Object.entries(byMovie).forEach(([movieId, shows]) => {
        const movie = MOVIES.find(m => m.id === movieId);
        const byDate = {};
        shows.forEach(s => { if (s.fillRate != null) (byDate[s.date] || (byDate[s.date] = [])).push(s); });
        Object.entries(byDate).forEach(([date, dayShows]) => {
          if (dayShows.length < 3) return;
          dayShows.forEach(s => {
            const others = dayShows.filter(x => x !== s);
            const otherAvg = others.reduce((a, x) => a + (x.fillRate || 0), 0) / others.length;
            if (s.fillRate >= OUTLIER_MIN_PCT && (s.fillRate - otherAvg) >= OUTLIER_MIN_GAP) {
              outliers.push({ cinema: cinemaName, movie, date, time: s.time, fillRate: s.fillRate, otherAvg: Math.round(otherAvg), total: s.total, filled: s.filled });
            }
          });
        });
      });
    });

    frozen.sort((a, b) => b.fillRate - a.fillRate || b.count - a.count);
    crossFilm.sort((a, b) => b.fillRate - a.fillRate);
    outliers.sort((a, b) => (b.fillRate - b.otherAvg) - (a.fillRate - a.otherAvg));
    return { frozen, crossFilm, outliers };
  }

  // Executive-summary style: at most one bullet per anomaly type (never one
  // per venue), each a headline + the single most notable example, so the
  // full-section size stays readable regardless of how many venues trip the
  // same pattern.
  const MAX_ANOMALY_BULLETS = 5;

  function renderAnomalies() {
    const { frozen, crossFilm, outliers } = detectAnomalies();
    if (!frozen.length && !crossFilm.length && !outliers.length) {
      return '<div class="empty-state">No frozen-inventory, cross-film duplicate, or bulk-booking patterns detected in the latest scrape.</div>';
    }

    const bullets = [];

    if (crossFilm.length) {
      const top = crossFilm[0];
      const names = Object.keys(top.byMovieName).join(" and ");
      bullets.push({
        priority: 100, sev: "severe", tag: "Shared seat counts",
        headline: `${crossFilm.length} venue${crossFilm.length > 1 ? "s report" : " reports"} identical booking counts across different films`,
        support: `Most notable: <b>${top.cinema}</b> shows the exact same <b>${top.filled}/${top.total}</b> seats (${top.fillRate}%) for ${names} &mdash; consistent with a shared or placeholder feed rather than live bookings. Worth excluding from head-to-head totals pending manual verification.`,
      });
    }

    if (frozen.length) {
      const top = frozen[0];
      bullets.push({
        priority: 90, sev: "moderate", tag: "Frozen booking counts",
        headline: `${frozen.length} cinema/film pair${frozen.length > 1 ? "s" : ""} show booking counts that never move`,
        support: `Highest: <b>${top.cinema}</b>'s <b>${top.movie.name}</b> stuck at <b>${top.filled}/${top.total}</b> seats (${top.fillRate}%) across ${top.dates.length} different dates &mdash; inconsistent with ticket-by-ticket sales, more likely a stale or placeholder feed.`,
      });
    }

    if (outliers.length) {
      const top = outliers[0];
      bullets.push({
        priority: 70, sev: "mild", tag: "Possible bulk booking",
        headline: `${outliers.length} showtime${outliers.length > 1 ? "s look" : " looks"} like a possible bulk or corporate buyout`,
        support: `Sharpest jump: <b>${top.cinema}</b>'s ${fmtTime(top.time)} show of <b>${top.movie.name}</b> on ${fmtDate(top.date)} at <b>${top.fillRate}%</b> vs. ${top.otherAvg}% average for that cinema's other shows the same day. Could also be a popular prime-time slot.`,
      });
    }

    bullets.sort((a, b) => b.priority - a.priority);
    const topBullets = bullets.slice(0, MAX_ANOMALY_BULLETS);

    return `
      <p class="anomaly-caveat">Patterns flagged automatically from the latest scrape, not accusations &mdash; district.in is the only source here. Summarized to the headline case per pattern.</p>
      <div class="insights">${topBullets.map(b => `<div class="insight-card anomaly ${b.sev}"><span class="tag sev-${b.sev}">${b.tag}</span><span class="headline">${b.headline}</span><span class="support">${b.support}</span></div>`).join("")}</div>
    `;
  }

  // ---- show-wise tab (per movie, ported from the ticket-tile dashboard) ----
  function showsForDate(movie, date) {
    const rows = [];
    movie.cinemas.forEach(c => c.shows.filter(s => s.date === date).forEach(s => rows.push({ cinema: c.name, ...s })));
    return rows;
  }

  // Shared renderer for a list of {name, shows} cinemas on one date, sorted by
  // fill rate (or name). Used for the West Bengal list, the pan-India list, and
  // reused nowhere else — the BookMyShow directional list has its own renderer
  // since it has no real fill% to sort or bar-chart by.
  function buildCinemaGroups(cinemas, date, sortMode) {
    const groups = {};
    cinemas.forEach(c => {
      const shows = c.shows.filter(s => s.date === date).sort((a, b) => a.time.localeCompare(b.time));
      if (shows.length) groups[c.name] = shows;
    });
    let names = Object.keys(groups);
    if (!names.length) return null;
    const avgOf = n => groups[n].reduce((a, s) => a + (s.fillRate || 0), 0) / groups[n].length;
    if (sortMode === "fill-desc") names.sort((a, b) => avgOf(b) - avgOf(a));
    else if (sortMode === "fill-asc") names.sort((a, b) => avgOf(a) - avgOf(b));
    else names.sort((a, b) => a.localeCompare(b));

    return names.map(name => {
      const shows = groups[name];
      const avg = Math.round(avgOf(name));
      const tickets = shows.map(s => {
        const pct = s.fillRate == null ? 0 : s.fillRate;
        const st = statusFor(pct);
        const tagline = s.tag || s.fmt || "";
        return `<div class="ticket">
          <div class="time">${fmtTime(s.time)}</div>
          <div class="tag">${tagline}</div>
          <div class="bar-track"><div class="bar-fill bar-${st.cls}" style="width:${Math.min(pct, 100)}%"></div></div>
          <div class="pct"><span class="status-${st.cls}">${pct}%</span><span>${s.filled}/${s.total}</span></div>
        </div>`;
      }).join("");
      return `<div class="cinema-block">
        <p class="cname">${name}<span class="avg">avg ${avg}% fill &middot; ${shows.length} show${shows.length > 1 ? "s" : ""}</span></p>
        <div class="ticket-row">${tickets}</div>
      </div>`;
    }).join("");
  }

  // BookMyShow-only halls: no real seat count, just a status band (Available /
  // Filling Fast / Housefull) — rendered with dashed tickets and no bar/number
  // so it never reads as the same precision as the District-sourced data.
  function buildBmsGroups(bmsData) {
    if (!bmsData || !bmsData.cinemas || !bmsData.cinemas.length) return null;
    const bandCls = status => {
      const s = (status || "").toUpperCase();
      if (s.includes("HOUSEFULL") || s.includes("SOLD")) return "sold";
      if (s.includes("FAST") || s.includes("FILLING")) return "warn";
      return "good";
    };
    return bmsData.cinemas.map(c => {
      const tickets = (c.shows || []).map(s => {
        const cls = bandCls(s.status);
        return `<div class="ticket directional">
          <div class="time">${fmtTime(s.time)}</div>
          <div class="tag">${s.tag || ""}</div>
          <span class="band bg-${cls} status-${cls}">${s.status || "Available"}</span>
        </div>`;
      }).join("");
      return `<div class="cinema-block">
        <p class="cname">${c.name}<span class="avg">${(c.shows || []).length} show${(c.shows || []).length > 1 ? "s" : ""}</span></p>
        <div class="ticket-row">${tickets}</div>
      </div>`;
    }).join("");
  }

  function renderShowTab(movie) {
    const content = document.getElementById("content");
    const state = SHOW_TAB_STATE[movie.id] || (SHOW_TAB_STATE[movie.id] = { date: (movie.showDates || [])[0], sort: "fill-desc" });
    if (!state.date || !(movie.showDates || []).includes(state.date)) state.date = (movie.showDates || [])[0];

    const dates = movie.showDates || [];
    const todayRows = showsForDate(movie, state.date);
    const totalShows = todayRows.length;
    const avgFill = totalShows ? Math.round(todayRows.reduce((a, r) => a + (r.fillRate || 0), 0) / totalShows) : 0;
    const housefull = todayRows.filter(r => r.fillRate >= 95).length;
    const cinemaCount = new Set(todayRows.map(r => r.cinema)).size;

    const datePills = dates.map(d => `<div class="date-pill ${d === state.date ? "active" : ""}" data-date="${d}">${fmtDate(d)}</div>`).join("");

    const cinemaHtml = buildCinemaGroups(movie.cinemas, state.date, state.sort) || '<div class="empty-state">No shows found for this date.</div>';

    // Pan-India section (Eken only, for now) — District-sourced, real numbers,
    // but kept out of every West-Bengal-vs-West-Bengal comparison elsewhere.
    let panIndiaHtml = "";
    if (movie.panIndiaCinemas && movie.panIndiaCinemas.length) {
      const panGroups = buildCinemaGroups(movie.panIndiaCinemas, state.date, state.sort);
      if (panGroups) {
        const panRev = movie.panIndiaCinemas.reduce((a, c) => a + c.shows.filter(s => s.date === state.date).reduce((b, s) => b + (s.revenue || 0), 0), 0);
        const panShows = movie.panIndiaCinemas.reduce((a, c) => a + c.shows.filter(s => s.date === state.date).length, 0);
        panIndiaHtml = `
          <div class="source-section" id="panindia-section">
            <div class="source-head"><h3>Beyond West Bengal</h3><span class="source-badge bg-good status-good">District &middot; live</span></div>
            <p class="source-note">A handful of single-screen Cinepolis shows outside West Bengal — kept separate so the head-to-head tab's comparisons across all four films stay West-Bengal-only and apples-to-apples.</p>
            <div class="pan-india-stat"><span>Revenue, this date<b>${fmtRevenue(panRev)}</b></span><span>Shows<b>${panShows}</b></span></div>
            ${panGroups}
          </div>`;
      }
    }

    // BookMyShow-only halls — manually checked, not part of the hourly refresh.
    let bmsHtml = "";
    if (movie.bmsHalls && movie.bmsHalls.cinemas && movie.bmsHalls.cinemas.length) {
      const bmsGroups = buildBmsGroups(movie.bmsHalls);
      bmsHtml = `
        <div class="source-section" id="bms-section">
          <div class="source-head"><h3>BookMyShow &mdash; other halls</h3><span class="source-badge bg-warn status-warn">Directional &middot; checked ${fmtDate(movie.bmsHalls.checkedAt.slice(0,10))}</span></div>
          <p class="source-note">Not listed on District. BookMyShow shows only a status band per show (Available / Filling Fast / Housefull), not an exact seat count — so these carry no fill % or revenue, and are refreshed by hand on request, not hourly.</p>
          ${bmsGroups}
        </div>`;
    }

    // This list can run long (20+ cinemas before you'd ever reach BookMyShow
    // or pan-India), so surface a jump-nav right up top rather than make
    // either section something you only find by scrolling past everything else.
    const jumpLinks = [];
    if (bmsHtml) jumpLinks.push('<a href="#bms-section" class="jump-link">BookMyShow halls &darr;</a>');
    if (panIndiaHtml) jumpLinks.push('<a href="#panindia-section" class="jump-link">Beyond West Bengal &darr;</a>');
    const jumpNav = jumpLinks.length ? `<div class="jump-nav">${jumpLinks.join("")}</div>` : "";

    content.innerHTML = `
      <div class="date-pills">${datePills}</div>
      <div class="kpi-row">
        <div class="kpi-card stat-tile"><p class="label">Shows this date</p><div class="big">${totalShows}</div></div>
        <div class="kpi-card stat-tile"><p class="label">Avg fill rate</p><div class="big" style="color:var(--accent)">${avgFill}%</div></div>
        <div class="kpi-card stat-tile"><p class="label">Housefull shows</p><div class="big">${housefull}</div></div>
        <div class="kpi-card stat-tile"><p class="label">Cinemas screening</p><div class="big">${cinemaCount}</div></div>
      </div>
      ${jumpNav}
      <div class="status-legend">
        <span><i class="dot" style="background:var(--good)"></i>Available &lt;40%</span>
        <span><i class="dot" style="background:var(--warn)"></i>Filling fast 40&ndash;74%</span>
        <span><i class="dot" style="background:var(--crit)"></i>Almost full 75&ndash;94%</span>
        <span><i class="dot" style="background:var(--sold)"></i>Housefull 95%+</span>
      </div>
      <div class="sort-row">
        <span>Sort cinemas by</span>
        <select id="sortSelect">
          <option value="fill-desc" ${state.sort === "fill-desc" ? "selected" : ""}>Highest fill rate</option>
          <option value="fill-asc" ${state.sort === "fill-asc" ? "selected" : ""}>Lowest fill rate</option>
          <option value="name" ${state.sort === "name" ? "selected" : ""}>Name (A&ndash;Z)</option>
        </select>
      </div>
      ${cinemaHtml}
      ${bmsHtml}
      ${panIndiaHtml}
    `;

    content.querySelectorAll(".date-pill").forEach(p => {
      p.addEventListener("click", () => { state.date = p.dataset.date; renderShowTab(movie); });
    });
    const sortSelect = content.querySelector("#sortSelect");
    if (sortSelect) sortSelect.addEventListener("change", e => { state.sort = e.target.value; renderShowTab(movie); });
  }

  // ---- master render -----------------------------------------------------
  function renderAll() {
    renderTabBar();
    const content = document.getElementById("content");
    if (!MOVIES.length) { content.innerHTML = '<div class="empty-state">No data yet.</div>'; return; }

    if (ACTIVE_TAB !== "h2h") {
      const movie = MOVIES.find(m => m.id === ACTIVE_TAB);
      if (!movie) { ACTIVE_TAB = "h2h"; } else { renderShowTab(movie); return; }
    }

    const dates = allDates();
    const kpi = renderKpis(dates);

    content.innerHTML = `
      ${filmLegendHtml()}

      <div class="kpi-head">
        <div><p class="section-title">Today&rsquo;s snapshot</p><p class="section-sub">${fmtDate(kpi.focusDate)} &middot; ${fmtDow(kpi.focusDate)}</p></div>
      </div>
      <div class="kpi-row">${kpi.html}</div>

      <div class="kpi-head">
        <div><p class="section-title">Revenue so far</p><p class="section-sub">Cumulative estimated gross across every tracked date, highest first</p></div>
      </div>
      ${renderRevenueStrip(dates)}

      <div class="kpi-head">
        <div><p class="section-title">Trends so far</p><p class="section-sub">Daily average fill rate and estimated revenue, by film</p></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="toggle-group">
            <button class="toggle-btn ${VIEW === "fill" ? "active" : ""}" data-view="fill">Fill rate %</button>
            <button class="toggle-btn ${VIEW === "rev" ? "active" : ""}" data-view="rev">Est. revenue</button>
          </div>
        </div>
        <div id="chartHost">${VIEW === "fill" ? buildLineChart(dates) : buildBarChart(dates)}</div>
      </div>

      <div class="kpi-head">
        <div><p class="section-title">Head-to-head by day</p><p class="section-sub">Fill rate and estimated revenue per film, per date &middot; dot marks the day's leader (ties with &lt;${MIN_SHOWS_FOR_COMPARISON} shows never get the dot)</p></div>
      </div>
      <div class="panel" style="background:transparent; border:none; padding:0;">${renderTable(dates)}</div>

      <div class="kpi-head">
        <div><p class="section-title">By cinema chain</p><p class="section-sub">Cumulative fill rate per chain, per film &middot; standalone single-screen halls group under Independent / Other</p></div>
      </div>
      <div class="panel" style="background:transparent; border:none; padding:0;">${renderChainTable()}</div>

      <div class="kpi-head">
        <div><p class="section-title">Insights</p><p class="section-sub">Generated fresh from the latest scrape, not static commentary</p></div>
      </div>
      ${renderInsights(dates)}

      <div class="kpi-head">
        <div><p class="section-title">Anomalies &amp; possible block booking</p><p class="section-sub">Patterns flagged automatically from the latest scrape &mdash; see each card for why</p></div>
      </div>
      ${renderAnomalies()}
    `;

    wireFilmLegend(content);
    content.querySelectorAll(".toggle-btn").forEach(btn => {
      btn.addEventListener("click", () => { VIEW = btn.dataset.view; renderAll(); });
    });
  }

  let BMS_HALLS = {}; // movieId -> bms_halls doc data

  function attachBmsHalls() {
    MOVIES.forEach(m => { m.bmsHalls = BMS_HALLS[m.id] || null; });
  }

  // Static-site data loading: no account, no login, no live db — this page is
  // regenerated roughly every 30 minutes (see .github/workflows/update.yml) and
  // simply fetches the JSON snapshot that run produced.
  async function loadFromStatic() {
    try {
      const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("data.json: HTTP " + res.status);
      const payload = await res.json();
      MOVIES = (payload.movies || []).sort((a, b) => a.name.localeCompare(b.name));
      MOVIES.forEach(m => ACTIVE.add(m.id));

      // Hand-curated BookMyShow halls — a static sibling file, not touched by the
      // GitHub Action. Missing/unreachable is fine: the page just shows none.
      try {
        const bmsRes = await fetch("bms_halls.json?t=" + Date.now(), { cache: "no-store" });
        if (bmsRes.ok) {
          const bmsPayload = await bmsRes.json();
          Object.entries(bmsPayload || {}).forEach(([id, v]) => { BMS_HALLS[id] = v; });
          attachBmsHalls();
        }
      } catch (e) { console.error("bms_halls.json failed to load", e); }

      const newest = MOVIES.reduce((acc, m) => !acc || (m.scrapedAt || "") > acc ? m.scrapedAt : acc, null);
      document.getElementById("updatedLine").innerHTML = MOVIES.length
        ? `Last scraped <b>${timeAgo(newest)}</b>`
        : "No data yet.";
      document.getElementById("footnote").innerHTML =
        "Estimated revenue = booked seats &times; the ticket price listed for that seat category on district.in, summed per show; it excludes convenience fees, taxes and any offline/BOM sales, so treat it as a directional gross, not an official number. Fill rate = booked &divide; total seats per showtime, aggregated across price tiers. Cinema chain is inferred from the venue name's prefix on district.in (Cinepolis, INOX, PVR, Miraj Cinemas, SVF Cinemas, Nazrultirtha Cinema), not an official affiliation list; standalone halls group under Independent / Other. Head-to-head comparisons (trends, revenue, chain breakdown, insights) are West-Bengal-only for all four films, even for The Eken, which also plays a handful of single-screen shows outside West Bengal (see its own tab). Source: public showtime pages on district.in, refreshed roughly every 30 minutes via GitHub Actions; BookMyShow-only halls are checked by hand and refreshed on request, not automatically.";
      renderAll();
    } catch (e) {
      document.getElementById("updatedLine").textContent = "Couldn't load data.json.";
      document.getElementById("content").innerHTML = '<div class="empty-state">Data snapshot failed to load. It refreshes every 30 minutes — try again shortly.</div>';
      console.error(e);
    }
  }

  loadFromStatic();
</script>
</body>
</html>
